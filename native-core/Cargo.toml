[package]
name = "native_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "PyMOL native-core: phase-1 FFI seam proof-of-concept (fixed-width float parsing)"
license = "MIT"
publish = false

[lib]
# staticlib: linked into the PyMOL C++ extension.
# The C++-side cxx glue (lib.rs.cc / lib.rs.h) is generated by corrosion's
# corrosion_add_cxxbridge (or the cxxbridge CLI) and compiled by the C++ build,
# so this crate itself does NOT run cxx_build in a build.rs -- that keeps the
# glue single-sourced and avoids duplicate-symbol links.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned for reproducible builds (see plan open-question on vendoring).
cxx = "=1.0.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
